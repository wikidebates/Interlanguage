{
	"name": "Interlanguage PHP 8.4",
	"on": {
		"push": {
			"branches": [
				"main"
			]
		},
		"pull_request": null,
		"workflow_dispatch": null
	},
	"permissions": {
		"contents": "read"
	},
	"concurrency": {
		"group": "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}",
		"cancel-in-progress": true
	},
	"jobs": {
		"regression": {
			"runs-on": "ubuntu-24.04",
			"timeout-minutes": 10,
			"steps": [
				{
					"uses": "actions/checkout@v5",
					"with": {
						"persist-credentials": false
					}
				},
				{
					"uses": "shivammathur/setup-php@v2",
					"with": {
						"php-version": "8.4",
						"coverage": "none"
					}
				},
				{
					"name": "Check all tracked PHP sources",
					"run": "set -euo pipefail\ngit ls-files -z -- '*.php' | xargs -0 -n 1 php -l"
				},
				{
					"name": "Run all nine isolated regression suites",
					"run": "set -euo pipefail\ntests=(tests/*SmokeTest.php)\ntest \"${#tests[@]}\" -eq 9\nfor test in \"${tests[@]}\"; do\n\tphp \"$test\"\ndone"
				}
			]
		}
	}
}
